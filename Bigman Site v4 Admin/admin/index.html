<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Bigman Academic Services</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div id="admin-app">
  <!-- Login overlay -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <div class="login-logo">
        <i class="fas fa-graduation-cap"></i>
        <div>
          <span class="ln-main">BIGMAN</span>
          <span class="ln-sub">Admin Panel</span>
        </div>
      </div>
      <h2>Administrator Sign In</h2>
      <div class="login-msg" id="loginMsg" style="display:none;"></div>
      <form id="loginForm">
        <div class="lf-field">
          <label>Email</label>
          <div class="lf-wrap"><i class="fas fa-envelope"></i>
            <input type="email" id="adminEmail" placeholder="admin@bigmanacademicservices.com" required />
          </div>
        </div>
        <div class="lf-field">
          <label>Password</label>
          <div class="lf-wrap"><i class="fas fa-lock"></i>
            <input type="password" id="adminPassword" placeholder="Password" required />
            <button type="button" onclick="togglePwd(this)" class="eye-btn"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-lbl"><i class="fas fa-sign-in-alt"></i> Sign In</span>
          <span class="btn-spin" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
        </button>
      </form>
      <p class="login-back"><a href="../index.html">← Back to website</a></p>
    </div>
  </div>

  <!-- Admin Layout -->
  <div id="adminLayout" style="display:none;">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <i class="fas fa-graduation-cap"></i>
        <div>
          <span class="sl-main">BIGMAN</span>
          <span class="sl-sub">Admin Panel</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard">
          <i class="fas fa-chart-pie"></i><span>Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-page="orders">
          <i class="fas fa-file-alt"></i><span>Orders</span>
          <span class="nav-badge" id="pendingBadge">0</span>
        </a>
        <a href="#" class="nav-item" data-page="users">
          <i class="fas fa-users"></i><span>Students</span>
        </a>
        <a href="#" class="nav-item" data-page="contacts">
          <i class="fas fa-envelope"></i><span>Contacts</span>
          <span class="nav-badge" id="contactsBadge">0</span>
        </a>
        <a href="#" class="nav-item" data-page="newsletter">
          <i class="fas fa-paper-plane"></i><span>Newsletter</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="sidebar-logout" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <div class="admin-main">
      <!-- Top bar -->
      <header class="admin-topbar">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-right">
          <span class="admin-greeting" id="adminGreeting"></span>
          <span class="status-dot"></span>
          <span style="font-size:.78rem;color:#94a3b8;">API Connected</span>
        </div>
      </header>

      <!-- Pages -->
      <div class="admin-content" id="adminContent">
        <!-- Content rendered by JS -->
        <div class="page-loader" id="pageLoader"><i class="fas fa-spinner fa-spin"></i></div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
